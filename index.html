<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="description" content="Shrinkz — modern territory-claim arcade. Seal empty regions while bouncing balls try to stop you." />
    <title>Shrinkz</title>
    <!-- wasm-opt=0: trunk's bundled binaryen rejects bulk-memory ops from modern Rust/Bevy. -->
    <link data-trunk rel="rust" data-bin="shrinkz" data-wasm-opt="0" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a0b0e;
        overflow: hidden;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        color: #e8eaef;
      }
      /* Bevy canvas is injected into body */
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #0a0b0e;
        z-index: 10;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #loading.hidden {
        opacity: 0;
      }
      #loading h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      #loading p {
        margin: 0;
        font-size: 0.9rem;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>Shrinkz</h1>
      <p>Loading…</p>
    </div>
    <script>
      // Hide loading once the canvas appears (Bevy started).
      const hide = () => {
        const el = document.getElementById("loading");
        if (el) {
          el.classList.add("hidden");
          setTimeout(() => el.remove(), 500);
        }
      };
      const obs = new MutationObserver(() => {
        if (document.querySelector("canvas")) {
          hide();
          obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // Fallback if canvas was already there
      if (document.querySelector("canvas")) hide();
    </script>
  </body>
</html>
